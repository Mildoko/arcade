name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # basePath 跟 site.config.json 走（项目站是 /arcade，换自定义域名后改成 ""）
      - name: Build
        run: node build.mjs --clean

      - name: Static checks
        run: node tools/check.mjs

      - name: Gate + intake tests
        run: |
          node tests/gate.test.mjs
          node tests/intake.test.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
